# -*- mode: c; c-basic-offset: 4; indent-tabs-mode: nil; -*-
# vim:expandtab:shiftwidth=4:tabstop=4:
%include "common.conf"

define_policy cursor_touch {
    status_manager = basic;
    scope { type == file and status != 'ok' }
    default_action = cmd("touch {fullpath}");
    default_lru_sort_attr = none;
}

cursor_touch_rules {
    rule default {
        condition { last_mod < 1h }
    }
}

cursor_touch_parameters {
    db_result_size_max = 2;
    nb_threads = 1;
}

cursor_touch_trigger {
    trigger_on = scheduled;
    check_interval = 5min;
}
