# -*- mode: c; c-basic-offset: 4; indent-tabs-mode: nil; -*-
# vim:expandtab:shiftwidth=4:tabstop=4:
%include "common.conf"

define_policy raw_count_touch {
    status_manager = basic;
    scope { type == file and status != 'ok' }
    default_action = cmd("sleep 1");
    default_lru_sort_attr = last_mod;
}

raw_count_touch_rules {
    rule default {
        condition { last_mod > 1h }
    }
}

raw_count_touch_parameters {
    db_result_size_max = 5;
    queue_size = 1;
    nb_threads = 1;
}

raw_count_touch_trigger {
    trigger_on = scheduled;
    check_interval = 5min;
}
